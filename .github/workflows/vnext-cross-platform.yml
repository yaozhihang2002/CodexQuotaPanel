name: vNext cross-platform

on:
  push:
    branches:
      - codex/vnext-windows-macos
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "CodexQuotaPanel.VNext.slnx"
      - ".github/workflows/vnext-cross-platform.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - name: Restore once
        run: dotnet restore CodexQuotaPanel.VNext.slnx
      - name: Build once
        run: dotnet build CodexQuotaPanel.VNext.slnx --configuration Release --no-restore
      - name: Domain checks
        run: dotnet run --project tests/CodexQuota.Domain.Tests --configuration Release --no-build
      - name: Application checks
        run: dotnet run --project tests/CodexQuota.Application.Tests --configuration Release --no-build
      - name: Infrastructure checks
        run: dotnet run --project tests/CodexQuota.Infrastructure.Tests --configuration Release --no-build
      - name: UI render matrix
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          scenarios=(
            zh-dark-single-100 zh-dark-dual-150 zh-light-single-100
            en-dark-single-100 en-dark-dual-150 en-light-single-100
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            scenarios+=(zh-light-dual-200 en-light-dual-200)
          fi
          for scenario in "${scenarios[@]}"
          do
            dotnet run --project tests/CodexQuota.UI.Tests --configuration Release --no-build -- \
              artifacts/vnext-preview "$scenario"
          done
      - name: Upload UI matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vnext-preview-${{ matrix.os }}
          path: artifacts/vnext-preview/*.png
