name: vNext cross-platform

on:
  workflow_dispatch:
    inputs:
      package_macos:
        description: Build one universal signed-ad-hoc macOS DMG
        required: false
        type: boolean
        default: false
  push:
    branches:
      - codex/vnext-windows-macos
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "CodexQuotaPanel.VNext.slnx"
      - ".github/workflows/vnext-cross-platform.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - name: Restore once
        run: dotnet restore CodexQuotaPanel.VNext.slnx
      - name: Build once
        run: dotnet build CodexQuotaPanel.VNext.slnx --configuration Release --no-restore
      - name: Domain checks
        run: dotnet run --project tests/CodexQuota.Domain.Tests --configuration Release --no-build
      - name: Application checks
        run: dotnet run --project tests/CodexQuota.Application.Tests --configuration Release --no-build
      - name: Infrastructure checks
        run: dotnet run --project tests/CodexQuota.Infrastructure.Tests --configuration Release --no-build
      - name: Platform checks
        run: dotnet run --project tests/CodexQuota.Platform.Tests --configuration Release --no-build
        env:
          CODEXQUOTA_PLATFORM_MUTATION_TESTS: 1
      - name: UI render matrix
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          scenarios=(
            zh-dark-single-100 zh-dark-dual-150 zh-light-single-100
            en-dark-single-100 en-dark-dual-150 en-light-single-100
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            scenarios+=(zh-light-dual-200 en-light-dual-200)
          fi
          for scenario in "${scenarios[@]}"
          do
            dotnet run --project tests/CodexQuota.UI.Tests --configuration Release --no-build -- \
              artifacts/vnext-preview "$scenario"
          done
          dotnet run --project tests/CodexQuota.UI.Tests --configuration Release --no-build -- \
            artifacts/vnext-preview formal
      - name: Upload UI matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vnext-preview-${{ matrix.os }}
          path: artifacts/vnext-preview/*.png
          retention-days: 1

  macos-package:
    name: macOS native package
    if: github.event_name == 'workflow_dispatch' && inputs.package_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - name: Build one universal app bundle and DMG
        shell: pwsh
        run: |
          ./installer/macOS/Build-Package.ps1 -Version 0.6.1 -Runtime osx-universal -SkipChecks -DmgOnly
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: CodexQuotaPanel-0.6.1-macOS-DMG
          path: artifacts/release-v0.6.1-macos/CodexQuotaPanel-0.6.1-macOS.dmg
          if-no-files-found: error
          retention-days: 1
